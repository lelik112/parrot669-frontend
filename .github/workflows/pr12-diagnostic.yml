name: PR12 Team CSS approved repeat 754d37
on:
  push:
    branches: ['diagnostic/pr12-team-css-766821-once']
    paths:
      - '.github/workflows/pr12-diagnostic.yml'
      - '.github/diagnostics/pr12/**'
permissions:
  contents: read
concurrency:
  group: pr12-team-css-766821-one-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and one-shot scope
        run: |
          test "$(git rev-parse HEAD^)" = 5bbfaf40bfce1b127fba3a53224b3542afcb2768
          test "$(git diff --name-only HEAD^ HEAD | grep -vE '^(\.github/(workflows/pr12-diagnostic.yml|diagnostics/pr12/run.py)|tests/e2e/(http-session|team-page)\.spec\.cjs)$' | wc -l)" = 0
          git cat-file -e 2c17d1356abec57dad677e741eb974553db06b74^{tree}
          test "$(git diff --name-only b444855cf5f982b315c515fc00c41cc109f3ae6a HEAD | grep -vE '^(public/assets/team.css|\.github/(workflows/pr12-diagnostic.yml|diagnostics/pr12/run.py))$' | wc -l)" = 0
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p diagnostic-evidence
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium only
        run: npx --no-install playwright install --with-deps chromium
      - name: Run five selected Team tests once
        timeout-minutes: 12
        run: python3 .github/diagnostics/pr12/run.py
      - name: Bound text evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path('diagnostic-evidence')
          files=list(root.rglob('*')) if root.exists() else []
          files=[p for p in files if p.is_file()]
          allowed=bool(files) and all(p.suffix in ('.json','.txt') and not p.is_symlink() for p in files)
          size=sum(p.stat().st_size for p in files)
          allowed=allowed and size<=64*1024*1024
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('DIAGNOSTIC_EVIDENCE_ALLOWED='+str(allowed).lower()+'\n')
          print('Diagnostic text evidence bytes:',size,'; allowed:',allowed)
          if not allowed: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && env.DIAGNOSTIC_EVIDENCE_ALLOWED == 'true'
        with:
          name: pr12-team-css-766821-diagnostic
          path: diagnostic-evidence/
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
